<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#212631"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#6a11cb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Base -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad)" stroke="#303846" stroke-width="2"/>

  <!-- Outer Tech Circuit Ring (Subtle) -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="#2c3440" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="#252b36" stroke-width="1"/>

  <!-- Hexagon Shield Frame -->
  <polygon points="128,40 206,85 206,171 128,216 50,171 50,85" 
           fill="#1a1d24" stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Glowing Inner Hexagon Accent -->
  <polygon points="128,52 196,91 196,165 128,204 60,165 60,91" 
           fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Stylized Debugger Bug & Disassembly Symbol -->
  <!-- Bug Antennae / Crosshair Top -->
  <path d="M106 82 L90 64 M150 82 L166 64" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
  <circle cx="90" cy="64" r="3" fill="#00f2fe"/>
  <circle cx="166" cy="64" r="3" fill="#00f2fe"/>

  <!-- Bug Head -->
  <path d="M110 88 C110 80, 146 80, 146 88 L146 96 L110 96 Z" fill="#3a7bd5"/>

  <!-- Disassembly Code Brackets / Bug Body -->
  <path d="M102 110 L82 128 L102 146" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M154 110 L174 128 L154 146" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Core Processor / Memory Node -->
  <rect x="114" y="108" width="28" height="40" rx="6" fill="url(#shieldGrad)"/>
  
  <!-- Central Breakpoint Dot (Glowing Red/Orange) -->
  <circle cx="128" cy="128" r="6" fill="#ff4b4b" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="3" fill="#ffffff"/>

  <!-- Bug Legs / Register Bus Taps -->
  <path d="M72 104 L52 98 M72 128 L48 128 M72 152 L52 158" stroke="#3a7bd5" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M184 104 L204 98 M184 128 L208 128 M184 152 L204 158" stroke="#3a7bd5" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Bottom Pointer / Binary Unwind Indicator -->
  <path d="M118 162 L128 174 L138 162" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="128" y1="174" x2="128" y2="190" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round"/>
</svg>
