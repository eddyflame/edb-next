name: edb-next CI

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-formatting:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Verify Formatting (clang-format)
        run: |
          echo "Checking C++ formatting against .clang-format..."
          find core ui tests \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) | xargs clang-format --dry-run --Werror || echo "::warning::Formatting differences detected against .clang-format. Please run 'clang-format -i' before pushing."

  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Modern Compiler (GCC 13 on Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Configure Linux Kernel ptrace permissions
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            qt6-base-dev \
            qt6-tools-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libcapstone-dev \
            libelf-dev \
            libdw-dev \
            python3-dev \
            liblua5.4-dev \
            ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ matrix.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.os }}-ccache-${{ github.ref }}-
            ${{ matrix.os }}-ccache-

      - name: Configure CMake with ccache
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Initialize ccache statistics
        run: ccache -z

      - name: Build All Targets
        run: cmake --build build -j$(nproc)

      - name: Display ccache statistics
        run: ccache -s

      - name: Verify Sample Plugin Built
        run: test -f build/plugins/sample_plugin.so

      - name: Run Core Regression Test Suite
        run: ./build/test_core

      - name: Run DWARF Regression Test Suite
        run: ./build/test_dwarf

      - name: Run Advanced Regression Test Suite
        run: ./build/test_advanced

      - name: Run Embedded Scripting Test Suite
        run: ./build/test_scripting

      - name: Run Window Teardown Stress Test
        run: ./build/test_exit

  package-appimage:
    name: Build AppImage Packaging (Ubuntu 22.04 LTS)
    runs-on: ubuntu-22.04
    needs: [build-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Modern Compiler (GCC 13 on Ubuntu 22.04)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Install Dependencies & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            qt6-base-dev \
            qt6-tools-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libcapstone-dev \
            libelf-dev \
            libdw-dev \
            python3-dev \
            liblua5.4-dev \
            wget \
            file \
            patchelf

      - name: Run AppImage Packaging Script
        run: |
          ./scripts/build_appimage.sh

      - name: Verify AppImage Integrity
        run: |
          test -f build/edb-next-x86_64.AppImage
          chmod +x build/edb-next-x86_64.AppImage
          ./build/edb-next-x86_64.AppImage --appimage-extract
          QT_QPA_PLATFORM=offscreen ./squashfs-root/AppRun --help || true

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edb-next-x86_64.AppImage
          path: build/edb-next-x86_64.AppImage
          if-no-files-found: error
